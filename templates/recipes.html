<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <title>Data Table</title>
</head>
<body>
   <table>
      <thead>
         <tr>
            {% for column in data.columns %}
            <th>{{ column }}</th>
            {% endfor %}
         </tr>
      </thead>
      <tbody>
         {% for index, row in data.iterrows() %}
         <tr>
            {% for value in row %}
            <td>{{ value }}</td>
            {% endfor %}
         </tr>
         {% endfor %}
      </tbody>
   </table>
</body>
</html>
